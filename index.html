<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoFin - Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cadastro-container">

        <div class="cadastro-card">

            <img
                src="logo.png"
                alt="Logo EcoFin"
                class="logo-cadastro"
            >

            <h1>Bem-vindo ao EcoFin!</h1>

            <p class="cadastro-subtitulo">
                Vamos começar organizando sua vida financeira.
            </p>

            <form id="formCadastro">

                <label for="nome">
                    Seu nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="salarioCadastro">
                    Seu salário
                </label>

                <input
                    type="number"
                    id="salarioCadastro"
                    placeholder="Ex: 1500"
                    min="0"
                    step="0.01"
                    required
                >

                <button
                    type="submit"
                    class="botao-verde"
                >
                    Começar no EcoFin
                </button>

            </form>

            <p
                id="mensagemCadastro"
                class="mensagem-meta"
            ></p>

            <p class="cadastro-info">
                Seus dados ficam salvos neste navegador.
            </p>

        </div>

    </main>

    <script src="cadastro.js"></script>

</body>

</html>
